<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101317" />
  <title>StageCue · 现场歌词提词器</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .exit-stage{position:fixed;z-index:6;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));background:#1a2028e8;border-color:#47515e;color:#e7ebf0;padding:8px 12px;font-size:14px;backdrop-filter:blur(8px)}
    .font-stepper{position:fixed;z-index:6;right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:grid;gap:8px}.font-stepper button{width:48px;height:48px;padding:0;background:#1a2028e8;border-color:#47515e;color:#f1f3f6;font-weight:800;font-size:18px;backdrop-filter:blur(8px)}
    @media(max-width:680px){.exit-stage{top:10px;left:10px;padding:7px 10px}.exit-stage span{display:none}}
    .lyric-links{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}.lyric-links a{display:flex;align-items:center;gap:8px;border:1px solid #384351;border-radius:9px;background:#171c22;color:#f1f4f7;text-decoration:none;padding:10px 13px;font-size:14px}.lyric-links a:hover{border-color:#f5a623}.lyric-links b{color:#f5a623}.lyric-links small{color:#9aa5b3;font-size:12px}
    .song-manager{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}.song-manager select,.song-manager input{background:#12161b;color:#eef1f4;border:1px solid #394452;border-radius:8px;padding:10px;font:inherit}.song-manager select{min-width:190px}.song-picker{position:fixed;z-index:7;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top))}.song-picker>button{background:#1a2028e8;border-color:#47515e;backdrop-filter:blur(8px)}.song-menu{display:none;position:absolute;right:0;top:44px;width:min(310px,78vw);max-height:58vh;overflow:auto;padding:7px;background:#1b2129;border:1px solid #46515e;border-radius:10px}.song-menu.open{display:grid;gap:5px}.song-menu button{text-align:left;background:#252d37;border-color:transparent}.song-menu button.current{border-color:#f5a623;color:#f5a623}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">STAGE<span>CUE</span><small>现场歌词提词器</small></div>
    <div class="mode-switch" role="group" aria-label="模式">
      <button id="editModeBtn" class="active">编辑</button><button id="showModeBtn">演出</button>
    </div>
    <div class="header-actions">
      <button id="openSettingsBtn" title="演出设置">设置</button>
      <button id="fullscreenBtn" title="全屏">全屏</button>
    </div>
  </header>

  <main id="editor" class="editor">
    <section class="card import-card">
      <h1>演出歌曲与歌词</h1>
      <p>可提前批量导入多首带时间戳的 <b>.lrc / .srt / .vtt</b> 文件；演出中随时切歌。</p>
      <div class="song-manager"><select id="songSelect" aria-label="当前歌曲"></select><input id="songName" aria-label="歌曲名称" placeholder="当前歌曲名称" /><button id="addSongBtn">＋ 新建歌曲</button><button id="deleteSongBtn" class="danger">删除本曲</button></div>
      <div class="lyric-links" aria-label="LRC 歌词快捷导航">
        <a href="https://www.9ilrc.com/" target="_blank" rel="noopener"><b>9iLRC</b><small>中文 LRC 搜索与下载</small></a>
        <a href="https://dinoosauro.github.io/lrclib-get/" target="_blank" rel="noopener"><b>LRCLIB Get</b><small>同步歌词搜索 / 下载</small></a>
        <a href="https://lrclib.net/" target="_blank" rel="noopener"><b>LRCLIB 数据库</b><small>英文歌同步歌词库</small></a>
        <a href="https://www.lzltool.com/" target="_blank" rel="noopener"><b>在线打轴</b><small>没有 LRC 时自己制作</small></a>
      </div>
      <div class="import-actions">
        <label class="primary file-label">批量导入歌词<input id="lrcFile" type="file" multiple hidden></label>
        <button id="loadDemoBtn">载入示例</button>
        <button id="clearBtn" class="danger">清空</button>
      </div>
      <textarea id="pasteArea" placeholder="也可以把 LRC 内容粘贴到这里，例如：&#10;[00:12.50]第一句歌词&#10;[00:16.20]第二句歌词"></textarea>
      <button id="parsePasteBtn">解析粘贴内容</button>
    </section>
    <section class="card lyrics-card">
      <div class="section-head"><h2>歌词时间轴</h2><button id="addLineBtn">＋ 添加一句</button></div>
      <div id="lyricsEditor" class="lyrics-editor"></div>
    </section>
  </main>

  <main id="stage" class="stage hidden">
    <button id="exitStageBtn" class="exit-stage" aria-label="返回编辑模式">‹ <span>返回编辑</span></button>
    <div class="song-picker"><button id="songMenuBtn">☰ 歌单</button><div id="songMenu" class="song-menu"></div></div>
    <div class="font-stepper" aria-label="快速调整字号"><button id="fontDownBtn" aria-label="减小字号">A−</button><button id="fontUpBtn" aria-label="增大字号">A+</button></div>
    <div class="stage-status"><span id="currentTime">00:00.0</span><span id="nextCue">尚未开始</span></div>
    <div id="cueScroller" class="cue-scroller" tabindex="0"><div id="cueList"></div></div>
    <div class="stage-controls">
      <button id="prevBtn">上一句</button><button id="playBtn" class="play">▶ 开始</button><button id="nextBtn">下一句</button>
      <button id="resetBtn">↺ 重置</button>
    </div>
  </main>

  <aside id="settings" class="settings hidden">
    <div class="settings-head"><h2>演出设置</h2><button id="closeSettingsBtn">×</button></div>
    <label>字号 <output id="fontSizeValue">64 px</output><input id="fontSize" type="range" min="28" max="160" value="64" /></label>
    <label>提前显示 <output id="leadTimeValue">0.0 秒</output><input id="leadTime" type="range" min="0" max="10" step="0.1" value="0" /></label>
    <label>行间距 <output id="lineHeightValue">1.35</output><input id="lineHeight" type="range" min="1" max="2.2" step="0.05" value="1.35" /></label>
    <label class="check"><input id="autoScroll" type="checkbox" checked /> 自动跟随滚动</label>
    <label class="check"><input id="wakeLock" type="checkbox" checked /> 演出时保持屏幕常亮</label>
    <p class="help">演出模式下可直接点任一句歌词，计时会立即跳转到它的时间点，方便现场校正。</p>
  </aside>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
